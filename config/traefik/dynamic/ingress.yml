# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
tls:
  options:
    default:
      minVersion: "VersionTLS13"
      # {{ if or ( env "TRAEFIK_TLS_RESOLVER" ) ( env "TRAEFIK_TLS_CERT" ) }}
      sniStrict: true
      # {{ end }}
      # {{ if env "TRAEFIK_MTLS_CERTS" }}
      clientAuth:
        clientAuthType: "RequireAndVerifyClientCert"
        caFiles:
          # {{ range $i, $v := env "TRAEFIK_MTLS_CERTS" | splitList "\n" }}
          - '{{ $v }}'
          # {{ end }}
      # {{ end }}
    postgres:
      alpnProtocols: ["postgresql"]
  # {{ if env "TRAEFIK_TLS_CERT" }}
  certificates:
    - keyFile: '{{ env "TRAEFIK_TLS_KEY" }}'
      certFile: '{{ env "TRAEFIK_TLS_CERT" }}'
  # {{ end }}
http:
  routers:
    https-redirect:
      rule: 'PathPrefix(`/`)'
      entryPoints: ["http"]
      middlewares: ["https-redirect"]
      service: "noop@internal"
    grist:
      rule: 'Host(`{{ env "GRIST_DOMAIN" }}`)'
      entryPoints: ["https"]
      middlewares: ["compress", "security-headers", "grist-security-headers"]
      service: "grist"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    authentik:
      rule: 'Host(`{{ env "AUTHENTIK_DOMAIN" }}`)'
      entryPoints: ["https"]
      middlewares: ["compress", "security-headers", "authentik-security-headers"]
      service: "authentik"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    silo-s3:
      rule: 'Host(`{{ env "SILO_DOMAIN" }}`)'
      entryPoints: ["https"]
      service: "silo-s3"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    silo-console:
      rule: 'Host(`{{ env "SILO_DOMAIN" }}`) && (PathPrefix(`/console/`) || PathPrefix(`/outpost.goauthentik.io/`))'
      entryPoints: ["https"]
      middlewares: ["compress", "forward-auth", "strip-prefix", "security-headers", "silo-console-security-headers"]
      service: "silo-console"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    grafana:
      rule: 'Host(`{{ env "GRAFANA_DOMAIN" }}`)'
      entryPoints: ["https"]
      middlewares: ["compress", "security-headers", "grafana-security-headers"]
      service: "grafana"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    prometheus:
      rule: 'Host(`{{ env "PROMETHEUS_DOMAIN" }}`)'
      entryPoints: ["https"]
      middlewares: ["compress", "forward-auth", "security-headers", "prometheus-security-headers"]
      service: "prometheus"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    traefik:
      rule: 'Host(`{{ env "TRAEFIK_DOMAIN" }}`)'
      entryPoints: ["https"]
      middlewares: ["compress", "forward-auth", "security-headers", "traefik-security-headers"]
      service: "api@internal"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: "https"
        permanent: true
    compress:
      compress:
        minResponseBodyBytes: 1024
        includedContentTypes:
          - "application/javascript"
          - "application/json"
          - "application/wasm"
          - "application/xml"
          - "image/svg+xml"
          - "text/css"
          - "text/html"
          - "text/javascript"
          - "text/plain"
    strip-prefix:
      stripPrefixRegex:
        regex: ['\/[^\/]+']
    forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-authentik-username"
          - "X-authentik-groups"
          - "X-authentik-email"
          - "X-authentik-name"
          - "X-authentik-uid"
          - "X-authentik-jwt"
          - "X-authentik-meta-jwks"
          - "X-authentik-meta-outpost"
          - "X-authentik-meta-provider"
          - "X-authentik-meta-app"
          - "X-authentik-meta-version"
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        referrerPolicy: "strict-origin"
        contentTypeNosniff: true
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
    grist-security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://www.youtube.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' blob: data:;
          connect-src 'self' https://raw.githubusercontent.com;
          frame-src 'self' https://gristlabs.github.io https://www.youtube.com;
    authentik-security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' blob: data:;
    silo-console-security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' blob: data:;
    grafana-security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' blob: data:;
          worker-src 'self' blob:;
    prometheus-security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' blob: data:;
    traefik-security-headers:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' blob: data:;
  services:
    grist:
      loadBalancer:
        servers:
          - url: "http://grist:8484"
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
    silo-s3:
      loadBalancer:
        servers:
          - url: "http://silo:9000"
    silo-console:
      loadBalancer:
        servers:
          - url: "http://silo:9001"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"
tcp:
  routers:
    authentik-ldap:
      rule: 'HostSNI(`{{ env "AUTHENTIK_DOMAIN" }}`)'
      entryPoints: ["ldaps"]
      service: "authentik-ldap"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
    postgres:
      rule: 'HostSNI(`*`)'
      entryPoints: ["postgres"]
      service: "postgres"
      tls:
        certResolver: '{{ env "TRAEFIK_TLS_RESOLVER" }}'
        options: "postgres"
  services:
    authentik-ldap:
      loadBalancer:
        servers:
          - address: "authentik-ldap:3389"
    postgres:
      loadBalancer:
        servers:
          - address: "postgres:5432"
