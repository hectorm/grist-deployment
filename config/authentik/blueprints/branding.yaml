# yaml-language-server: $schema=https://version-2026-8.goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: "Branding"
  labels:
    blueprints.goauthentik.io/description: "Branding"
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Apply "Default - Brand" blueprint
  - model: "authentik_blueprints.metaapplyblueprint"
    identifiers: {}
    attrs:
      identifiers:
        name: "Default - Brand"
      required: true
  # Apply "Authentication flow configuration" blueprint
  - model: "authentik_blueprints.metaapplyblueprint"
    identifiers: {}
    attrs:
      identifiers:
        name: "Authentication flow configuration"
      required: true
  # Apply branding to default brand
  - id: "default-brand"
    identifiers:
      domain: "authentik-default"
    model: "authentik_brands.brand"
    attrs:
      branding_title: "authentik"
      attributes:
        settings:
          enabledFeatures:
            settings: true
            notificationDrawer: true
            applicationEdit: false
            apiDrawer: false
            search: false
